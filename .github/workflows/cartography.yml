name: Cartography integration
on:
  pull_request:
    paths:
      - schemas/agent-guard-inventory-v1.schema.json
      - schemas/agent-guard-inventory-manifest-v1.schema.json
      - schemas/agent-guard-mcp-inventory-v1.schema.json
      - integrations/cartography/**
      - deployment/cartography/**
      - packages/**
      - apps/agent-map/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - scripts/build.mjs
      - .github/workflows/cartography.yml
  push:
    branches: [main]
    paths:
      - schemas/agent-guard-inventory-v1.schema.json
      - schemas/agent-guard-inventory-manifest-v1.schema.json
      - schemas/agent-guard-mcp-inventory-v1.schema.json
      - integrations/cartography/**
      - deployment/cartography/**
      - packages/**
      - apps/agent-map/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - scripts/build.mjs
      - .github/workflows/cartography.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartography-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract-and-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/cartography
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit
      - run: uv run python scripts/test-disposable-neo4j.py -- -q
      - run: uv build
      - run: uv build --wheel dist/agent_guard_cartography-0.1.0a1.tar.gz --out-dir dist/from-sdist
      - run: uv run --isolated --no-project --with ./dist/from-sdist/agent_guard_cartography-0.1.0a1-py3-none-any.whl python scripts/check-installed.py
