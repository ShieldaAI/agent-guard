name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
  security-alerts:
    name: Unresolved security alerts
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require reviewed or fixed code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_REF: ${{ github.ref }}
        run: |
          gh api --paginate --slurp --method GET "repos/$GH_REPO/code-scanning/alerts" \
            -f state=open -f ref="$REVIEW_REF" > code-scanning-alerts.json
          node <<'NODE'
          const fs = require('node:fs');
          const pages = JSON.parse(fs.readFileSync('code-scanning-alerts.json', 'utf8'));
          if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page))) throw Error('Invalid security-alert response');
          const alerts = pages.flat().map(alert => ({ number: alert.number, rule: alert.rule?.id,
            severity: alert.rule?.security_severity_level, state: alert.state }));
          fs.writeFileSync('security-alert-summary.json', JSON.stringify({ ref: process.env.REVIEW_REF, open: alerts.length, alerts }, null, 2));
          console.log(JSON.stringify({ open: alerts.length, alerts }));
          if (alerts.length) process.exitCode = 1;
          NODE
      - name: Retain security-alert evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-alert-summary
          path: security-alert-summary.json
          if-no-files-found: error
          retention-days: 7
