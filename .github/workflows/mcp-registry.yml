name: MCP Registry
# Publishes packages/check/server.json to the official MCP Registry as
# io.github.ShieldaAI/agent-guard-check once a release's npm package is live.
#
# It signs in with GitHub's OIDC token for this repository, which the registry accepts for the
# io.github.ShieldaAI namespace: no personal access token or stored secret is involved.
# Runs on a published GitHub release (the release script creates it after npm publish), or by
# hand for an existing release: gh workflow run mcp-registry.yml -f version=1.7.0
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish, such as 1.7.0 (its tag v<version> must exist)
        required: true
permissions:
  contents: read
concurrency:
  group: mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the registry's GitHub OIDC sign-in
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      SERVER_NAME: io.github.ShieldaAI/agent-guard-check
      PACKAGE: '@shieldaai/agent-guard-check'
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          # Only exact releases: a prerelease or anything else is not published to the registry.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not an exact release version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Check server.json against the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          file=packages/check/server.json
          [ "$(jq -r .name "$file")" = "$SERVER_NAME" ] || { echo "::error::$file names another server" >&2; exit 1; }
          [ "$(jq -r .version "$file")" = "$VERSION" ] || { echo "::error::$file is not at $VERSION" >&2; exit 1; }
          [ "$(jq -r '.packages[0].version' "$file")" = "$VERSION" ] || { echo "::error::$file's npm package is not at $VERSION" >&2; exit 1; }

      - name: Skip if the registry already has this version
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          found=$(curl -fsS --retry 3 "https://registry.modelcontextprotocol.io/v0.1/servers?search=${SERVER_NAME}" |
            jq --arg n "$SERVER_NAME" --arg v "$VERSION" '[.servers[] | select(.server.name == $n and .server.version == $v)] | length')
          echo "found=$found" >> "$GITHUB_OUTPUT"
          [ "$found" = 0 ] || echo "::notice::$SERVER_NAME $VERSION is already in the registry"

      # The registry checks mcpName in the package npm serves, so wait until npm serves it.
      - name: Wait for npm
        if: steps.existing.outputs.found == '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://registry.npmjs.org/${PACKAGE/\//%2f}/$VERSION"
          for _ in $(seq 1 40); do
            name=$(curl -fsS "$url" 2> /dev/null | jq -r '.mcpName // empty' || true)
            [ "$name" = "$SERVER_NAME" ] && { echo "npm serves $PACKAGE@$VERSION with mcpName $name"; exit 0; }
            echo "waiting for npm to serve $PACKAGE@$VERSION ..."
            sleep 15
          done
          echo "::error::npm does not serve $PACKAGE@$VERSION with mcpName $SERVER_NAME after 10 minutes" >&2
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.existing.outputs.found == '0'

      - name: Download and verify mcp-publisher
        if: steps.existing.outputs.found == '0'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          # Signed by the registry's own release workflow for exactly this tag.
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish
        if: steps.existing.outputs.found == '0'
        working-directory: packages/check
        run: |
          set -euo pipefail
          mcp-publisher validate
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Confirm
        if: steps.existing.outputs.found == '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            found=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=${SERVER_NAME}" |
              jq --arg n "$SERVER_NAME" --arg v "$VERSION" '[.servers[] | select(.server.name == $n and .server.version == $v)] | length')
            [ "$found" != 0 ] && { echo "$SERVER_NAME $VERSION is in the MCP Registry" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 15
          done
          echo "::warning::published, but the registry search does not list $VERSION yet" >&2
