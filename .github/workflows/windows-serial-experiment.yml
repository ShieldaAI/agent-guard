name: Windows serial test experiment
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-hex source commit; changes only test-file scheduling
        required: true
        type: string
        default: '9709f70e14062732917b1568238624c54b2771f4'
permissions:
  contents: read
concurrency:
  group: windows-serial-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  serial-check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
      TRIGGER_COMMIT: ${{ github.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Validate the exact source input
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '\A[0-9a-fA-F]{40}\z') { throw 'SOURCE_COMMIT_INVALID' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match the failed 9709 Windows job exactly, rather than float Node 24.
          node-version: '24.22.2'
          cache: npm
      - name: Prepare bounded evidence and the unchanged suite command
        shell: pwsh
        run: |
          @'
          import { spawn, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { availableParallelism } from 'node:os';
          import { dirname, join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const output = join(process.env.RUNNER_TEMP, 'windows-serial-experiment');
          const phase = process.argv[2];
          const globs = ['packages/core/test/*.test.mjs', 'packages/mcp/test/*.test.mjs',
            'packages/scenarios/test/*.test.mjs', 'packages/executor/test/*.test.mjs',
            'packages/agent-map/test/*.test.mjs', 'apps/agent-map/test/*.test.mjs',
            'apps/agent-ops/test/*.test.mjs', 'scripts/*.test.mjs'];
          const maximumLogBytes = 16 * 1024 * 1024;
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          function git(args) {
            const result = spawnSync('git', args, { encoding: 'utf8', maxBuffer: 65536, timeout: 10000 });
            if (result.error || result.status !== 0) throw Error('SOURCE_INSPECTION_FAILED');
            return result.stdout.trim();
          }
          function writeJson(name, value) {
            const text = JSON.stringify(value, null, 2) + '\n';
            if (Buffer.byteLength(text) > 8192) throw Error('EVIDENCE_LIMIT');
            writeFileSync(join(output, name), text, { flag: 'wx' });
          }
          try {
            if (process.platform !== 'win32' || process.arch !== 'x64' || process.version !== 'v24.22.2') throw Error('RUNTIME_MISMATCH');
            const source = git(['rev-parse', 'HEAD']), tree = git(['rev-parse', 'HEAD^{tree}']);
            const requested = process.env.SOURCE_COMMIT.toLowerCase();
            const workflow = process.env.WORKFLOW_COMMIT, trigger = process.env.TRIGGER_COMMIT;
            if ([source, tree, requested, workflow, trigger].some(value => !/^[0-9a-f]{40}$/.test(value)) ||
                source !== requested || git(['status', '--porcelain']) !== '') throw Error('SOURCE_MISMATCH');
            const runId = process.env.WORKFLOW_RUN_ID, runAttempt = process.env.WORKFLOW_RUN_ATTEMPT;
            if (![runId, runAttempt].every(value => /^[0-9]{1,30}$/.test(value))) throw Error('RUN_IDENTITY_INVALID');
            const packageBytes = readFileSync('package.json'), lockBytes = readFileSync('package-lock.json');
            const metadata = JSON.parse(packageBytes);
            if (metadata.scripts.test !== 'npm run build && node --test ' + globs.join(' ') ||
                metadata.scripts.check !== 'npm test && npm run test:pack' ||
                metadata.scripts['test:pack'] !== 'node scripts/check-packages.mjs') throw Error('SUITE_CONTRACT_CHANGED');
            const { trustedNpmCli } = await import(pathToFileURL(resolve('scripts/trusted-npm.mjs')).href);
            const npmCli = trustedNpmCli();
            if (phase === 'prepare') {
              mkdirSync(output, { recursive: false });
              const npmVersion = JSON.parse(readFileSync(join(dirname(dirname(npmCli)), 'package.json'))).version;
              if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(npmVersion)) throw Error('NPM_VERSION_INVALID');
              writeJson('source.json', { schemaVersion: 1, experiment: 'windows-test-file-concurrency-1',
                requestedSourceCommit: requested, sourceCommit: source, sourceTree: tree,
                workflowCommit: workflow, triggerCommit: trigger, runId, runAttempt,
                node: process.version, npm: npmVersion, platform: process.platform, architecture: process.arch,
                availableParallelism: availableParallelism(), testFileConcurrency: 1, globs,
                packageSha256: sha256(packageBytes), lockSha256: sha256(lockBytes), maximumLogBytes,
                originalAssertionsAndDeadlines: true, retries: 0, performanceAcceptanceEvidence: false });
            } else {
              const commands = { install: [npmCli, 'ci', '--ignore-scripts'], build: [npmCli, 'run', 'build'],
                tests: ['--test', '--test-concurrency=1', ...globs], pack: [npmCli, 'run', 'test:pack'] };
              if (!Object.hasOwn(commands, phase)) throw Error('PHASE_INVALID');
              const log = join(output, phase + '.log');
              writeFileSync(log, '', { flag: 'wx' });
              const record = { phase, startedAt: new Date().toISOString(), finished: false, exitCode: null,
                spawnFailed: false, logLimitExceeded: false, retainedBytes: 0 };
              writeFileSync(join(output, phase + '.json'), JSON.stringify(record) + '\n', { flag: 'wx' });
              const child = spawn(process.execPath, commands[phase], { stdio: ['ignore', 'pipe', 'pipe'], windowsHide: true });
              const capture = chunk => {
                const retained = chunk.subarray(0, Math.max(0, maximumLogBytes - record.retainedBytes));
                if (retained.length) { appendFileSync(log, retained); process.stdout.write(retained); record.retainedBytes += retained.length; }
                if (retained.length !== chunk.length) record.logLimitExceeded = true;
              };
              child.stdout.on('data', capture); child.stderr.on('data', capture);
              child.once('error', () => { record.spawnFailed = true; });
              child.once('close', code => {
                record.finished = true; record.finishedAt = new Date().toISOString();
                record.exitCode = Number.isSafeInteger(code) ? code : null;
                record.logSha256 = sha256(readFileSync(log));
                record.sourceUnchanged = git(['status', '--porcelain']) === '' && git(['rev-parse', 'HEAD']) === source;
                writeFileSync(join(output, phase + '.json'), JSON.stringify(record, null, 2) + '\n');
                process.exitCode = code === 0 && !record.spawnFailed && !record.logLimitExceeded && record.sourceUnchanged ? 0 : 1;
                if (record.logLimitExceeded) process.stderr.write('EXPERIMENT_LOG_LIMIT_EXCEEDED\n');
              });
            }
          } catch {
            process.stderr.write('WINDOWS_SERIAL_EXPERIMENT_SETUP_FAILED\n'); process.exitCode = 1;
          }
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/windows-serial-experiment.mjs" -Encoding utf8
          node "$env:RUNNER_TEMP/windows-serial-experiment.mjs" prepare
      - name: Install the exact locked dependencies
        run: node "$env:RUNNER_TEMP/windows-serial-experiment.mjs" install
      - name: Build the selected source
        run: node "$env:RUNNER_TEMP/windows-serial-experiment.mjs" build
      - name: Run every original test file with serial file scheduling
        # No NODE_OPTIONS, per-test concurrency override, filtering, retries, or prewarming.
        run: node "$env:RUNNER_TEMP/windows-serial-experiment.mjs" tests
      - name: Verify installed package consumers after successful tests
        run: node "$env:RUNNER_TEMP/windows-serial-experiment.mjs" pack
      - name: Retain exact source binding and bounded logs even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-serial-experiment
          path: ${{ runner.temp }}/windows-serial-experiment/
          if-no-files-found: error
          retention-days: 30
