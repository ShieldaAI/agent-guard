[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agent-guard-cartography"
version = "0.1.0a1"
description = "Experimental Agent Guard inventory contract and Cartography snapshot integration"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "cartography==0.144.0",
  "botocore==1.40.61",
  "jsonschema>=4.25,<5",
]

[project.scripts]
agent-guard-cartography = "agent_guard_cartography.cli:main"
agent-guard-source-lifecycle = "agent_guard_cartography.lifecycle:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "build>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guard_cartography"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "README.md", "pyproject.toml", "hatch_build.py", "neo4j-image.txt", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires the disposable authenticated Neo4j test container"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
