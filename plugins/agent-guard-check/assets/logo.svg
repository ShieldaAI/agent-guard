<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#070D17"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE6C1"/>
      <stop offset="1" stop-color="#1C9BD6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Shield, centred so the circular crop keeps it whole -->
  <path d="M200 74 L292 108 V196 C292 254 254 298 200 322 C146 298 108 254 108 196 V108 Z"
        fill="none" stroke="url(#shield)" stroke-width="16" stroke-linejoin="round"/>
  <!-- A gate: two posts, and one call passing through the opening -->
  <rect x="152" y="160" width="14" height="86" rx="7" fill="#E8F1FA"/>
  <rect x="234" y="160" width="14" height="86" rx="7" fill="#E8F1FA"/>
  <circle cx="200" cy="203" r="15" fill="#3EE6C1"/>
</svg>
