# Reference permission mapping for upstream Cartography 0.144.0.
#
# The Agent Guard collector does not read this file. Its opt-in IAM policy evidence
# (includeIamPolicyEvidence in the AWS enrollment) applies the same three rules from
# code and writes its own G_AWS_POLICY_CANDIDATE relationships. Use this file only if
# you also run upstream Cartography's AWS sync against the same graph and want its
# CAN_READ/CAN_WRITE/CAN_LIST edges to follow the same rules: pass it to that sync's
# --permission-relationships-file option. A unit test keeps this file and the
# collector's rules identical.
#
# These are policy evidence edges, not effective authorization decisions.
# Cartography retains has_condition, condition_keys and conditions on each edge.
# Its mapper does not evaluate request-time conditions, resource policies,
# permission boundaries or session policies. Conditional Deny statements can
# suppress edges unconditionally, so a missing edge is never proof of denial.
#
# S3 object/prefix policies are projected onto the parent AWSS3Bucket by this
# upstream mapper. CAN_READ/CAN_WRITE therefore do not establish permission for
# every object or for a particular bound object/prefix.
#
# Do not add wildcards or other labels without extending and testing the consumer.
- target_label: AWSS3Bucket
  permissions:
    - s3:GetObject
  relationship_name: CAN_READ
- target_label: AWSS3Bucket
  permissions:
    - s3:PutObject
  relationship_name: CAN_WRITE
- target_label: AWSS3Bucket
  permissions:
    - s3:ListBucket
  relationship_name: CAN_LIST
